<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Service</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #fecaca;
      --danger-text: #991b1b;
      --good: #059669;
      --bad: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .nav {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav h1 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--primary);
    }

    .nav a {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      font-size: 0.875rem;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .main {
      padding: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
    }

    .card h3 {
      margin: 1rem 0 0.5rem;
      font-size: 1rem;
    }

    .input,
    .textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.3rem;
      font-size: 0.9rem;
      font-family: inherit;
      margin: 0.25rem 0;
    }

    .textarea {
      font-family: monospace;
      min-height: 120px;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.3rem;
      font-size: 0.875rem;
      cursor: pointer;
      margin: 0.25rem 0.25rem 0.25rem 0;
      background: #e2e8f0;
      color: var(--text);
    }

    .btn:hover {
      filter: brightness(0.95);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: var(--danger-text);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .tag {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      background: #e2e8f0;
      border-radius: 3px;
      font-size: 0.75rem;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }

    .status-good {
      color: var(--good);
      font-weight: 600;
    }

    .status-bad {
      color: var(--bad);
      font-weight: 600;
    }

    .msg {
      padding: 0.6rem 1rem;
      border-radius: 0.3rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }

    .msg-ok {
      background: #d1fae5;
      color: #065f46;
    }

    .msg-err {
      background: #fee2e2;
      color: #991b1b;
    }

    .list {
      margin: 0;
      padding-left: 1rem;
    }

    .list li {
      margin: 0.3rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .receiver-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 0.3rem;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 0.3rem;
      margin-bottom: 0.3rem;
      cursor: pointer;
    }

    .label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.75rem;
      display: block;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin: 0.75rem 0;
      font-size: 0.9rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <nav class="nav">
    <h1>Email Service</h1>
    <span>
      <a id="nav-groups" onclick="App.navigate('groups')">Groups</a>
      &nbsp;|&nbsp;
      <a id="nav-send" onclick="App.navigate('send-email')">Send Email</a>
      &nbsp;|&nbsp;
      <a href="http://localhost:8025" target="_blank">MailHog</a>
    </span>
  </nav>

  <main class="main">
    <div id="msg"></div>
    <div id="root">Loading...</div>
  </main>

  <script src="app.js"></script>
</body>

</html>
